name: Validator smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "fhir_repair/validators/**"
      - "docker/**"
      - ".github/workflows/validator-smoke.yml"

jobs:
  hapi-rest:
    runs-on: ubuntu-latest

    services:
      hapi:
        # Pinned HAPI version. Bumping this is a deliberate change and should
        # be paired with a re-run of the benchmark to detect validator drift.
        # No service-level healthcheck: the HAPI image does not ship curl, so
        # any in-container healthcheck command we could write would fail to
        # execute. The "Wait for HAPI" step below polls from the runner
        # instead, which has curl and reaches the container via mapped port.
        image: hapiproject/hapi:v7.4.0
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for HAPI
        # HAPI typically takes 60-120s to come up. We give it 5 minutes
        # before declaring failure.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/fhir/metadata > /dev/null; then
              echo "HAPI is up after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "HAPI did not start in time"
          # Dump container logs to aid debugging when it fails.
          docker ps -a
          docker logs "$(docker ps -aqf ancestor=hapiproject/hapi:v7.4.0)" || true
          exit 1

      - name: Run integration tests
        env:
          HAPI_BASE_URL: http://localhost:8080/fhir
        run: pytest -m integration
