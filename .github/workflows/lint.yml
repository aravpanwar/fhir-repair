name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Install via dev extras so the ruff version matches what
        # contributors run locally. Pinning a different ruff in this
        # workflow risks formatter-rule drift between CI and local.
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check fhir_repair tests benchmark

      - name: Run ruff format check
        run: ruff format --check fhir_repair tests benchmark
