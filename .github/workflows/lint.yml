name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.5.0

      - name: Run ruff check
        run: ruff check fhir_repair tests benchmark

      - name: Run ruff format check
        run: ruff format --check fhir_repair tests benchmark
