name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::All commits must include a DCO sign-off (git commit -s)."
            echo "::error::See CONTRIBUTING.md for details."
            exit 1
          fi
