# Local development stack.
#
# Starts a HAPI FHIR server (the validator backend) and, optionally, the
# fhir-repair CLI image as a one-shot container. Most users just run
# `docker compose up -d hapi` and use the CLI from their host.

services:
  hapi:
    # Pinned version. Bumping HAPI here is a deliberate change and should
    # be paired with a benchmark re-run because validator behaviour shifts
    # within minor releases. Update validator-smoke.yml to match.
    image: hapiproject/hapi:v7.4.0
    container_name: fhir-repair-hapi
    ports:
      - "8080:8080"
    environment:
      # Enable the $validate operation explicitly. Some HAPI builds keep
      # it off by default for performance reasons; we want it on.
      hapi.fhir.validation.requests_enabled: "true"
    # No volume or persistent datasource: HAPI uses its default in-image
    # H2 location, fresh on every start. Restart cost is ~60-90s; that
    # is acceptable for local dev and avoids permission issues with
    # named volumes on Docker Desktop.
    #
    # No service-level healthcheck: the HAPI image does not ship curl, so
    # an in-container healthcheck would never succeed. Poll from the host
    # instead, e.g. `curl http://localhost:8080/fhir/metadata`.

  # Optional: build and run the CLI as a container. Most users will run
  # the CLI on their host (faster iteration), but this profile is handy
  # for one-shot demos.
  fhir-repair:
    profiles: [cli]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fhir-repair:local
    depends_on:
      - hapi
    environment:
      HAPI_BASE_URL: "http://hapi:8080/fhir"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-6}"
    volumes:
      - ./in:/in:ro
      - ./out:/out
