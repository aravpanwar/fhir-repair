# Arm 3: every error goes to the LLM; no deterministic strategy runs.
# Same LLM tail and guard as the hybrid arm.
strategies:
  processing:
    - llm.resolve_invariant
    - llm

llm:
  provider: ${LLM_PROVIDER}
  model: ${LLM_MODEL}
  api_key: ${LLM_API_KEY}
  # DeepSeek thinks by default and thinking counts against the output cap.
  # At the adapter's 1024 the pilot saw answers cut off mid-thought, which
  # would score the config rather than the model.
  options:
    max_tokens: 8000

hallucination_guard:
  allow_change_existing_clinical_value: true
