[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "fhir-repair"
version = "0.1.0"
description = "Repair broken FHIR R4 resources with a deterministic-first, LLM-fallback approach."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Arav Panwar" },
]
keywords = ["fhir", "healthcare", "hl7", "validation", "repair", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fhirpathpy>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<0.29.0",
    "jinja2>=3.1.0,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12.0,<0.16.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0,<1.0.0",
]
openai = [
    "openai>=1.40.0,<2.0.0",
]
bedrock = [
    "boto3>=1.34.0,<2.0.0",
]
service = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.29.0,<1.0.0",
]
dev = [
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "respx>=0.21.0,<0.24.0",
    # Pinned to a single minor: ruff enables/disables rules between minors
    # (notably UP038), and an unpinned constraint causes CI to drift from
    # what contributors run locally.
    "ruff>=0.15.0,<0.16.0",
    "types-PyYAML",
    # boto3 ships no inline types, so the bedrock adapter needs stubs to
    # type-check. Only the bedrock-runtime client is used.
    "boto3-stubs[bedrock-runtime]",
]

[project.urls]
Homepage = "https://github.com/aravpanwar/fhir-repair"
Documentation = "https://github.com/aravpanwar/fhir-repair#readme"
Issues = "https://github.com/aravpanwar/fhir-repair/issues"
Source = "https://github.com/aravpanwar/fhir-repair"

[project.scripts]
fhir-repair = "fhir_repair.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["fhir_repair"]

[tool.hatch.build.targets.sdist]
include = [
    "/fhir_repair",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/DEPLOYMENT-COMPLIANCE.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = [
    "tests/",
    "benchmark/",
]

[[tool.mypy.overrides]]
module = "fhirpathpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests requiring a running HAPI server (deselect with '-m \"not integration\"')",
    "llm: tests requiring an LLM API key (deselect with '-m \"not llm\"')",
]

[tool.coverage.run]
source = ["fhir_repair"]
omit = [
    "fhir_repair/cli/main.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
